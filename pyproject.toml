[build-system]
requires = [
    "setuptools >= 77.0.0", # license and license-files alignment
]
build-backend = "setuptools.build_meta"

[project]
name = "ansibug"
description = "Ansible Debug Adapter Protocol Implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["COPYING", "LICENSE-MIT"]
authors = [{ name = "Jordan Borean", email = "jborean93@gmail.com" }]
keywords = ["ansible", "debug", "lsp", "dap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["version"]
dependencies = []

[project.urls]
homepage = "https://github.com/jborean93/ansibug"

[dependency-groups]
# The marker lets uv still lock the group for 3.10, zensical needs 3.11+. tox runs the docs env on 3.14.
docs = ["zensical >= 0.0.71; python_version >= '3.11'"]
dev = [
    "ansible-core >= 2.16.0",
    "argcomplete",
    "basedpyright >= 1.40.2",
    # Support for source_pkgs
    "coverage[toml] >= 5.3",
    "cryptography",
    "pre-commit",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "ruff >= 0.17.0",
    "tox-uv >= 1.34.0",
]
# The ansible-core release each tox ansible_X.Y factor tests against, locked in uv.lock like the rest. The markers
# leave out the Pythons a release doesn't support so uv can still lock the group for 3.10.
ansible-2-16 = ["ansible-core >= 2.16.0, < 2.17.0"]
ansible-2-17 = ["ansible-core >= 2.17.0, < 2.18.0"]
ansible-2-18 = ["ansible-core >= 2.18.0, < 2.19.0; python_version >= '3.11'"]
ansible-2-19 = ["ansible-core >= 2.19.0, < 2.20.0; python_version >= '3.11'"]
ansible-2-20 = ["ansible-core >= 2.20.0, < 2.21.0; python_version >= '3.12'"]
ansible-2-21 = ["ansible-core >= 2.21.0, < 2.22.0; python_version >= '3.12'"]
ansible-2-22 = ["ansible-core >= 2.22.0, < 2.23.0; python_version >= '3.13'"]

[tool.uv]
conflicts = [[
    { group = "ansible-2-16" },
    { group = "ansible-2-17" },
    { group = "ansible-2-18" },
    { group = "ansible-2-19" },
    { group = "ansible-2-20" },
    { group = "ansible-2-21" },
    { group = "ansible-2-22" },
]]

[project.optional-dependencies]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "ansibug._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ansibug = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "I",  # isort
    "UP",  # pyupgrade, the typing aliases basedpyright reports as deprecated
]

[tool.ruff.lint.isort]
known-first-party = ["ansibug"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
extraPaths = ["src", "tests/utils"]
reportAny = false
# typing.override is 3.12+, and the 3.10 floor would need typing_extensions for it.
reportImplicitOverride = false
# ansible-core ships no type stubs or py.typed, and ansibug supports several releases of it, so it's treated as
# untyped rather than inferred from the source of whichever release is installed.
reportMissingTypeStubs = false
useLibraryCodeForTypes = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnusedCallResult = false

executionEnvironments = [
    # Ansible plugins subclass and call into ansible-core, which is untyped, overriding methods whose parameters they
    # may not use, and set flags such as POST_DATATAGGING from the ansible-core release they import from.
    { root = "src/ansibug/_playbook", reportConstantRedefinition = false, reportUnknownParameterType = false, reportUnknownVariableType = false, reportUnusedParameter = false, reportUntypedBaseClass = false },
    { root = "tests/data", reportUnknownParameterType = false, reportUnknownVariableType = false, reportUnusedParameter = false, reportUntypedBaseClass = false },
    # pytest fixtures are parameters a test may not use, and monkeypatch.setattr takes an untyped lambda.
    { root = "tests", extraPaths = ["src", "tests/utils"], reportUntypedFunctionDecorator = false, reportUnusedParameter = false, reportUnknownLambdaType = false },
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = "tests"
junit_family = "xunit2"
# A test taking longer than a minute is a problem and sign of a deadlock
timeout = 60
# pytest-xdist doesn't play nice with signals so use the thread method
timeout_method = "thread"

[tool.coverage.paths]
source = ["src", ".tox/py*/**/site-packages"]

[tool.coverage.run]
branch = true
# Needed as tests run with a different cwd, env is set in tox
data_file = "${PROJECT_ROOT}/.coverage"
source_pkgs = ["ansibug"]
omit = ["*/ansibug/_version.py"]
parallel = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    sanity
    py3{10,11,12}-ansible_2.16-tests
    py3{10,11,12}-ansible_2.17-tests
    py3{11,12,13}-ansible_2.18-tests
    py3{11,12,13}-ansible_2.19-tests
    py3{12,13,14}-ansible_2.20-tests
    py3{12,13,14}-ansible_2.21-tests
    py3{13,14,15}-ansible_2.22-tests
    py3{13,14,15}-ansible_devel-tests
min_version = 4.0

[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-lock-runner
# The runner images can carry pre-release Pythons uv would otherwise prefer, use uv's own builds everywhere.
uv_python_preference = only-managed
dependency_groups =
    dev
    ansible_2.16: ansible-2-16
    ansible_2.17: ansible-2-17
    ansible_2.18: ansible-2-18
    ansible_2.19: ansible-2-19
    ansible_2.20: ansible-2-20
    ansible_2.21: ansible-2-21
    ansible_2.22: ansible-2-22

# devel moves with every commit so it can't be locked, it replaces the locked ansible-core after the sync. The lock
# runner ignores deps so it's installed here.
allowlist_externals =
    ansible_devel: uv

passenv =
    ANSIBUG_TEST_LOG_DIR
    GITHUB_ACTIONS
    PYTEST_ADDOPTS
set_env =
    # Needed for testing coverage
    tests: COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
    tests: PROJECT_ROOT={toxinidir}

commands_pre =
    ansible_devel: uv pip install --python {env_python} https://github.com/ansible/ansible/archive/devel.tar.gz
    tests: python -c 'import pathlib; pathlib.Path("{env_site_packages_dir}/cov.pth").write_text("import coverage; coverage.process_startup()")'

commands =
    sanity: python -m ruff check .
    sanity: python -m ruff format . --check
    sanity: python -m basedpyright --warnings

    tests: python -m ansible adhoc --version
    tests: python -m coverage run -m pytest -v {posargs:-n auto}

commands_post =
    tests: python -m coverage combine --quiet
    tests: python -m coverage report
    tests: python -m coverage xml

[testenv:docs]
base_python = py314
dependency_groups = docs
skip_install = true
commands =
    zensical build --strict
"""
